name: Daily LeadMiner Cloud Pipeline

on:
  schedule:
    # Runs daily at 13:30 UTC (9:30 AM EDT / 8:30 AM CDT / 6:30 AM PDT / 7:00 PM IST)
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

concurrency:
  group: leadminer-daily-pipeline
  cancel-in-progress: false

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger LeadMiner Step-by-Step Autonomous Pipeline
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL || 'https://leadminer-app.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "ERROR: CRON_SECRET secret is not set in GitHub repository secrets!"
            exit 1
          fi

          # D4: Run pipeline step-by-step so each step gets an isolated 60s Vercel execution window
          STEPS=("cleanup" "replies" "discovery" "verification" "planner" "dispatch")

          for STEP in "${STEPS[@]}"; do
            echo ""
            echo "=========================================================="
            echo "🚀 Executing Pipeline Step: $STEP"
            echo "=========================================================="

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$APP_URL/api/workers/pipeline?step=$STEP" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json")

            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            echo "HTTP Status: $HTTP_STATUS"
            echo "Response: $BODY"

            if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 409 ]; then
              echo "❌ Step $STEP failed with HTTP status $HTTP_STATUS"
              exit 1
            elif [ "$HTTP_STATUS" -eq 409 ]; then
              echo "⚠️ Step $STEP was skipped (lock held by another process)"
            else
              echo "✅ Step $STEP completed successfully"
            fi

            # Short pause between steps
            sleep 3
          done

          echo ""
          echo "🎉 All autonomous pipeline steps finished successfully!"
