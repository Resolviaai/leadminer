name: Daily LeadMiner Cloud Pipeline

on:
  schedule:
    # Runs daily at 13:30 UTC (9:30 AM EDT / 8:30 AM CDT / 6:30 AM PDT / 7:00 PM IST)
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

concurrency:
  group: leadminer-daily-pipeline
  cancel-in-progress: false

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Live LeadMiner Autonomous Pipeline
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL || 'https://leadminer-app.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "ERROR: CRON_SECRET secret is not set in GitHub repository secrets!"
            exit 1
          fi

          echo "Triggering autonomous pipeline on $APP_URL/api/workers/pipeline..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$APP_URL/api/workers/pipeline" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Pipeline Response: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Pipeline failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Autonomous pipeline completed successfully!"
