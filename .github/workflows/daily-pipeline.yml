name: Daily LeadMiner Cloud Pipeline

on:
  schedule:
    # Runs daily at 13:30 UTC (9:30 AM EDT / 8:30 AM CDT / 6:30 AM PDT / 7:00 PM IST)
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Live LeadMiner Autonomous Pipeline
        run: |
          echo "Triggering autonomous pipeline on https://leadminer-app.vercel.app/api/workers/pipeline..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://leadminer-app.vercel.app/api/workers/pipeline" \
            -H "Authorization: Bearer 7d3a8f1e5c2b9a4d6f8e0b1c3a5d7e9f" \
            -H "User-Agent: vercel-cron/1.0" \
            -H "Content-Type: application/json")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Pipeline Response: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Pipeline failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Autonomous pipeline completed successfully!"
